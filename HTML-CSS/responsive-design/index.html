<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>queries</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Orbitron&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"

    />
  </head>
  <body>
    <div id="hero-container">
      <header class="hero">
        <div class="heading">
          <h2>Chats</h2>
        </div>
        <div class="icons">
          <i class="ri-chat-new-fill"></i>
          <i class="ri-more-2-fill"></i>
        </div>
      </header>
      <div class="input-search">
        <input
          type="search"
          placeholder="Search or start a new chat"
          title="Search or start a new chat"
        />
      </div>
    </div>
    <nav class="navbar">
      <h3>all</h3>
      <h3>unread</h3>
      <h3>starred</h3>
      <h3>favourites</h3>
      <h3>personal</h3>
    </nav>

    <section class="chats">
      <div class="chat-1">
        <img
          src="akshat.png"
          alt="a man standing in front of a camera looking at a distance"
        />
        <div class="chat-details">
          <h2>AKSHU</h2>
          <p>Naha loo</p>
        </div>
      </div>
      <div class="chat-1">
        <img
          src="akshat.png"

        />
        <div class="chat-details">
          <h2>hahaha</h2>
          <p>mat nahao</p>
        </div>

  </body>
</html>
