<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html,
    body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      flex-direction: column;
      font-family: lexend;
    }
    .text {
      color: rgb(20, 19, 19);
      padding: 0.6rem 1rem;
    }
    .main {
      padding: 1.2rem 2rem;
    }
    .flex {
      display: flex;
      align-items: left;
      justify-content: left;
      flex-direction: column;
      gap: 1.2rem;
    }
    input {
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
    }

    .card {
      margin: 1rem 2.5rem;
      max-width: 500px;
      border: 1px solid #190909;
      border-radius: 20px;
      padding: 0.4rem 1rem;
      display: inline-block;
    }
    .profile {
      width: 100px;
      height: 100px;
      border: 1px solid rgb(14, 13, 13);
      border-radius: 50%;
      margin-bottom: 1rem;
      overflow: hidden;
      margin: auto 8px;
    }
    .profile img {
      width: 100px;
      height: auto;
      object-fit: cover;
    }
    h3 {
      font-size: 1.5rem;
      font-weight: 500;
      text-transform: capitalize;
    }
    h5 {
      font-size: 1.2rem;
      font-weight: 400;
      text-transform: capitalize;
    }
    h6 {
      font-size: 1.1rem;
      font-weight: 300;

    }
    p {
      padding:  1rem 0;
      font-size: 1rem;
      font-weight: 200;
      color: rgb(5, 13, 9);
    }
  </style>
  <body>
    <div class="main">
      <form class="flex" action="">
        <input type="text" placeholder="Enter Your Name" />
        <input type="text" placeholder="Role to Apply For" />
        <input type="text" placeholder="Description About Yourself" />
        <input type="email" placeholder="Enter Your Email" />
        <input type="text" placeholder="Profile pic" />
        <input type="submit" />
      </form>
    </div>
    <script src="script.js"></script>
  </body>
</html>
