<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        min-height: auto;
        overflow: hidden;
        background-color: #222;
        text-transform: capitalize;
        color: #fefefe;
        font-size: 1.2rem;
        text-align: center;
        text-shadow: 0 0 2px black;
      }

      #box {
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        padding: 2rem;
        width: 300px;
        height: 300px;
        background-color: rgb(122, 122, 214);
        transition: all cubic-bezier(0.19, 1, 0.22, 1);
      }

       #box h1 {
        font-size: 1.3rem;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgb(252, 252, 252);
        text-transform: capitalize;
       }
    </style>
    <div id="box">
        <h1>Don't let me touch you</h1>
    </div>

    <script src="script.js"></script>
  </body>
</html>
