<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #18181b;
    color: #fafafa;
    font-family: "Inter", "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: 4rem 1rem;
}

ul {
    width: min(420px, 100%);
    display: flex;
    flex-direction: column;
    gap: 1rem;
    list-style: none;
}

li {
    padding: 0.9rem 1.2rem;
    border: 1px solid #303036;
    border-radius: 12px;
    background: #202024;
    color: #e4e4e7;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: 0.2s ease;
    user-select: none;
    position: relative;
}

li::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #22c55e;
    position: absolute;
    left: -20px;
    top: 50%;
    transform: translateY(-50%);
}

li:hover {
    border-color: #3b82f6;
    background: #25252b;
    transform: translateX(6px);
}

.completed {
    color: #8b8b94;
    text-decoration: line-through;
    background: #252529;
    border-color: #2d2d31;
}

.completed::before {
    background: #71717a;
}

.completed:hover {
    transform: none;
    border-color: #2d2d31;
}
    </style>
  </head>
  <body>
    <ul>
      <li>guava</li>
      <li>apple</li>
      <li>grapes</li>
      <li>coconut</li>
      <li>chilli</li>
      <li>mango</li>
    </ul>
    <script src="script.js"></script>
  </body>
</html>
