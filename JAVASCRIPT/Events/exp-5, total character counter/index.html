<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #18181b;
        color: #e4e4e7;
        font-family: "Inter", "Segoe UI", sans-serif;

        display: flex;
        justify-content: center;
        padding: 4rem 1rem;
      }

      .container {
        width: min(500px, 100%);
      }

      h1 {
        margin-bottom: 2rem;
        font-size: 2rem;
      }

      input {
        width: 100%;
        padding: 0.9rem 1rem;

        border: 1px solid #3a3a40;
        border-radius: 12px;

        background: #27272a;
        color: #fafafa;

        outline: none;

        font-size: 1rem;

        transition: 0.2s;
      }

      input::placeholder {
        color: #7d7d86;
      }

      input:focus {
        border-color: #22c55e;
        box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.15);
      }

      .stats {
        margin-top: 2rem;

        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .card {
        background: #202024;
        border: 1px solid #2d2d33;
        border-radius: 12px;

        padding: 1rem 1.2rem;
      }

      .card h3 {
        color: #a1a1aa;
        font-weight: 500;
        font-size: 0.95rem;
        margin-bottom: 0.35rem;
      }

      .card p {
        color: #fafafa;
        font-size: 1.5rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Character Counter</h1>

      <input id="inp" type="text" placeholder="Type something..." />

      <div class="stats">
        <div class="card">
          <h3>Total Characters</h3>
          <p id="total">0</p>
        </div>

        <div class="card">
          <h3>Total Words</h3>
          <p id="words">0</p>
        </div>

        <div class="card">
          <h3>Preview</h3>
          <p id="characters"></p>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
