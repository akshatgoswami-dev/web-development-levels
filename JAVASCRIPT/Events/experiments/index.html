      html,
      body {
        width: 100%;
        height: 100%;
        background-color: #222;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Roboto mono;
      }
      .main {
        padding: 1.2rem 2rem;
      }
      input {
        padding: 12px 22px;
        border-radius: 10px;
        font-size: 1rem;
        user-select: none;
      }

      .text{
        background-color: rgb(8, 128, 112);
        padding: 12px 22px;
        color: #fff;
        border-radius: 10px;
        box-shadow: 0 1px 12px rgb(8, 128, 112);
        user-select: none;
      }
      .input{
        display: none;
      }
      .flex {
        display: flex;
        align-items: left;
        justify-content: center;
        flex-direction: column;
        gap: 1.2rem;
      }
