<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        min-height: auto;
        font-family: lexend;
        
      }
      h1 {
        margin: 2rem 1rem;
        text-align: center;
      }
      form {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 1rem;
      }
      input {
        padding: 6px 16px;
        text-align: center;
      }
      small {
        color: grey;
      }

      .green{
        color: rgb(0, 185, 0);
      }

      .red{
        color: rgb(232, 66, 66);
      }
    </style>
  </head>
  <body>
    <h1>A RANDOM PASSWORD</h1>
    <form class="form" action="">
      <input id="password" type="password" placeholder="Enter Your Password" />
      <small class="red" id="passError"></small>
      <input type="submit" />
    </form>

    <script src="script.js"></script>
  </body>
</html>
