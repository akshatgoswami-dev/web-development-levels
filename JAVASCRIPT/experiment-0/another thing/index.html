<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100vh;
        background-color: #222;
        color: whitesmoke;
        font-family: lexend;
      }

      .main {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3rem;
        margin: 2rem 0;
      }

      #clear {
        padding: 8px 22px;
        border-radius: 20px;
      }

      #text {
        width: 400px;
        height: 200px;
        padding: 12px;
      }
    </style>
  </head>
  <body>
    <main class="main">
      <textarea id="text"></textarea>
      <p id="chars">Characters: 0</p>
      <p id="words">Words: 0</p>
      <p id="status">Under limit</p>

      <button id="clear">Clear</button>
    </main>
    <script src="script.js"></script>
  </body>
</html>
