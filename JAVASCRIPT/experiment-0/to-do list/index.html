<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
      /* outline: 1px solid orangered; */
    }
    html,
    body {
      font-family: lexend;
      background-color: rgb(0, 0, 0);
    }

    header {
      width: 90%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: auto;
    }
    h1 {
      width: 100%;
      margin: 1rem;
      padding: 1rem;
      text-align: center;
      color: rgba(236, 229, 229, 0.722);
      border-bottom: 2px solid grey;
    }
    input {
      padding: 2rem;
      color: rgb(212, 31, 31);
    }
    label {
      height: 65px;
      gap: 1.2rem;
      padding: 1.2rem 0.4rem;
      text-align: center;
      color: white;
      display: flex;
      align-items: center;
      font-size: 20px;
      text-align: left;
      min-width: 400px;
      outline: 1px solid rgb(73, 72, 72);
    }

    label:has(input:checked) {
      text-decoration: line-through;
      filter: grayscale(72%) blur(1px);
      opacity: 0.5;
    }

    form {
      /* max-height: 500px; */
      margin: 0.6rem 6rem;
      display: flex;
      flex-direction: column;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;

      /* mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        black 8%,
        black 92%,
        transparent 100%
      ); */
    }

    ::-webkit-scrollbar {
      width: 3px;
    }

    ::-webkit-scrollbar-track {
      background: #0c0c0c75;
    }

    ::-webkit-scrollbar-thumb {
      background: #888;
      border-radius: 5px;
    }

    .addBtn {
      padding: 12px 20px;
      background-color: rgb(79, 79, 79);
      color: rgba(235, 235, 235, 0.878);
      font-size: 16px;
      font-weight: bold;
      border: 1px solid rgb(159, 158, 158);
      border-radius: 20px;
      text-align: center;
    }
    .form-wrapper {
      max-width: 800px;
      height: 700px;
      margin: 2rem 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* justify-content: center; */
      overflow-y: scroll;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /*---------modal----------*/

    .modal {
      color: #888;
      z-index: 1000;
      position: fixed;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.45);
      z-index: 999;
    }

    .modal-hide {
      display: flex;
    }

    .modal-content {
      background-color: rgb(31, 30, 30);
      display: flex;
      width: 480px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4rem;
      border: 1px solid rgba(72, 71, 71, 0.462);
      padding: 1.6rem;
      border-radius: 10px;
    }

    .modal-content h2 {
      color: rgb(202, 197, 197);
    }
    .modal-content input {
      background-color: #555454;
      color: rgba(240, 240, 240, 0.849);
      font-size: 20px;
      width: 400px;
      height: 100px;
      border: none;
      border-radius: 10px;
    }

    .modal-content input::placeholder {
      color: rgb(202, 197, 197);
    }
    .modal-content input:focus {
      border: none;
      outline: none;
      caret-color: #fdfeff;
    }
    .btn-container {
      display: flex;
      gap: 2.7rem;
      padding: 0.6rem;
    }

    .btn-container button {
      padding: 12px 30px;
      font-size: 1.08rem;
      border: none;
      background-color: #4e4d4d;
      border-radius: 10px;
      color: white;
    }

    #modal-add {
      background-color: rgba(210, 43, 43, 0.878);
    }

    .red-shadow {
      box-shadow: 0 0 20px rgb(170, 8, 8);
    }
    .white-shadow {
      box-shadow: 0 0 8px rgba(124, 121, 121, 0.5);
    }
    .text-shadow {
      text-shadow: 0 0 3px rgb(117, 115, 115);
    }
  </style>
