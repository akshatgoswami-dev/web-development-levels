<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@100..900&family=Happy+Monkey&family=Orbitron&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Saira:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }
    html,
    body {
      font-family: "Bitcount Single", system-ui;
      background-color: azure;
    }

    .hidden {
      display: none;
      color: red;
    }

    #main-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
    }
    .input {
      font-size: 20px;
      max-width: inherit;
      border: 1px solid black;
      border-radius: 6px;
      padding: 6px 12px;
      transition: all 0.3s ease-in-out;
    }
    .input:hover {
      background-color: rgb(105, 118, 118);
    }
    .input:hover::placeholder {
      color: white;
    }

    #input-container {
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      flex-direction: column;
      margin: 1.2rem 2.2rem;
    }
    #main-container h1 {
      font-size: 40px;
    }
    .input-cards {
      max-width: 350px;
      display: flex;
      align-items: center;
      flex-direction: column;
    }

    form{
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .input-cards input,
    .input-cards small {
      width: 100%;
    }

    small {
      display: block;
      min-height: 18px;
      color: red;
      font-size: 1rem;
      line-height: 1.2;
      
      /* visibility:hidden; */
      user-select: none;
    }

    .resultBefore {
      filter: grayscale(1);
      opacity: 0.4;
      transition: 0.3s ease;
      margin: 1rem 0;
      text-shadow: 1px 1px 13px black;
    }

    .resultAfter {
      color: rgb(7, 178, 84);
      font-weight: 500;
      transition: all 0.3s ease;
    }

    #Result {
      user-select: none;
    }

    #submit {
      text-transform: capitalize;
      cursor: pointer;
      max-width: 150px;
      padding: 0.3rem 0.6rem;
      letter-spacing: 1px;
      border-radius: 16px;
      font-size: 1.2rem;
      border: 1px solid black;
      background-color: rgb(78, 81, 78);
      color: #fff;
      transition: all 0.23s ease-in-out;
      margin: 1.4rem 0;
    }
    #submit:hover {
      background-color: rgb(43, 46, 46);
      transform: translateY(-2px);
      box-shadow: 0 0 5px black;
    }
  </style>
  <body>
    <div id="main-container">
      <h1>ENTER YOUR DETAILS</h1>
      <form >
        <div id="input-container">
          <div class="input-cards">
            <input
              class="input"
              id="name"
              type="text"
              placeholder="Enter Your Name"
              autocomplete="additional-name"
            />
            <small class="hidden  " id="nameError"></small>
          </div>
          <div class="input-cards">
            <input
              class="input"
              id="email"
              type="email"
              placeholder="Enter Your Email"
              autocomplete="additional-name"
            />
            <small class="hidden  " id="emailError"></small>
          </div>
          <div class="input-cards">
            <input
              class="input"
              id="password"
              type="password"
              placeholder="Enter Your Password"
            />
            <small class="hidden  " id="passwordError"></small>
            <div class="input-cards">
              <input type="submit" id="submit" />
              <small id="Result" class="resultBefore"
                >Everything You Submitted Is Valid ✅
              </small>
            </div>
          </div>
        </div>
      </form>
    </div>
    <script src="script.js"></script>
  </body>
</html>
