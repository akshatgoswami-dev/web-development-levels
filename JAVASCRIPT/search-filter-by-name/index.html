<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Search Filter</title>
      </head>
      <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          font-family: Arial, Helvetica, sans-serif;
        }

        body {
          background: #c0bdbdb3;
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
        }

        .container {
          height: auto;
          max-width: 840px;
          background: white;
          padding: 25px;
          border-radius: 12px;
          box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
          margin: 3rem 0;
        }

        h1 {
          text-align: center;
          margin-bottom: 20px;
          color: #333;
        }

        .inp {
          width: 100%;
          padding: 12px 15px;
          font-size: 16px;
          border: 2px solid #ddd;
          border-radius: 8px;
          outline: none;
          margin-bottom: 20px;
          transition: all 0.3s ease;
        }

        .inp:focus {
          border-color: royalblue;
        }

        .users {
          display: flex;
          flex-wrap: wrap;
          gap: 15px;
        }

        .user-card {
          width: 250px;
          padding: 15px;
          border-radius: 10px;
          background: #fafafa;
          border: 1px solid #e4e4e4;
          transition: 0.25s;
        }

        .user-card:hover {
          transform: translateY(-2px);
          box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .user-card h2 {
          font-size: 18px;
          color: #222;
          margin-bottom: 5px;
        }

        .user-card p {
          color: #666;
          font-size: 14px;
        }
      </style>

      <body>
        <div class="container">
          <h1>User Search</h1>

          <input class = "inp" type="text" placeholder="Search User" id="Search" />
          <div class="users"></div>
        </div>
        <script src="script.js"></script>
      </body>
    </html>
  </body>
</html>
